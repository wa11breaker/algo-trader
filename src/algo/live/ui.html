<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  /* zinc tokens as plain colours so the charts can use them too */
  :root {
    --background: #fafafa; --foreground: #09090b;
    --card: #ffffff; --muted: #f4f4f5; --muted-foreground: #71717a;
    --border: #e4e4e7; --ring: #a1a1aa; --primary: #18181b;
    --up: #16a34a; --down: #dc2626; --up-soft: #dcfce7; --down-soft: #fee2e2;
    --accent: #2563eb; --accent-soft: #dbeafe; --warn: #d97706;
    --radius: 12px;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #09090b; --foreground: #fafafa;
      --card: #111113; --muted: #1f1f23; --muted-foreground: #a1a1aa;
      --border: #27272a; --ring: #52525b; --primary: #fafafa;
      --up: #22c55e; --down: #ef4444; --up-soft: #052e16; --down-soft: #450a0a;
      --accent: #3b82f6; --accent-soft: #172554; --warn: #f59e0b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--background); color: var(--foreground); }
  body { font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  main { max-width: 1440px; margin: 0 auto; padding: var(--s5) var(--s5) var(--s6); }
  h1, h2, h3, p { margin: 0; }
  .muted { color: var(--muted-foreground); }
  .pos { color: var(--up); } .neg { color: var(--down); }

  /* header */
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
           gap: var(--s3) var(--s4); margin-bottom: var(--s4); }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  header .sub { font-size: 13px; color: var(--muted-foreground); margin-top: 2px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); font-size: 13px; }
  select:disabled { cursor: default; color: var(--muted-foreground); }
  select { font: inherit; font-weight: 600; color: var(--foreground); background: var(--card);
           border: 1px solid var(--border); border-radius: 8px; padding: 6px 32px 6px 12px; min-height: 36px;
           appearance: none; cursor: pointer;
           background-image: linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
                             linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
           background-position: right 14px top 15px, right 9px top 15px; background-size: 5px 5px; background-repeat: no-repeat; }
  select:focus-visible, button:focus-visible, .acct:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* badge */
  .badge { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px;
           font-size: 12px; font-weight: 600; line-height: 20px; background: var(--muted); color: var(--foreground); white-space: nowrap; }
  .badge.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.live { background: var(--up-soft); color: var(--up); }
  .badge.stale, .badge.halt, .badge.bad { background: var(--down-soft); color: var(--down); }
  .badge.good { background: var(--up-soft); color: var(--up); }
  .badge.info { background: var(--accent-soft); color: var(--accent); }
  .badge.closed { color: var(--muted-foreground); }

  /* account strip */
  .accounts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: var(--s3); margin-bottom: var(--s4); }
  .acct { text-align: left; font: inherit; color: inherit; background: var(--card); border: 1px solid var(--border);
          border-radius: var(--radius); padding: var(--s3) var(--s4); cursor: pointer; display: grid; gap: 2px; }
  .acct:hover { border-color: var(--ring); }
  .acct.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .acct .top { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); }
  .acct .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct .eq { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .acct .meta { font-size: 12px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* cards */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; }
  .card-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3);
            padding: var(--s4) var(--s4) 0; }
  .card-h h2 { font-size: 14px; font-weight: 600; }
  .card-h .muted { font-size: 12px; }
  .card-b { padding: var(--s3) var(--s4) var(--s4); }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s3); margin-bottom: var(--s4); }
  .kpi { padding: var(--s3) var(--s4); }
  .kpi .k { font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
  .kpi .v { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
  .kpi .s { font-size: 12px; color: var(--muted-foreground); margin-top: 2px; }

  /* layout */
  .layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); gap: var(--s4); align-items: start; }
  .col { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s4); min-width: 0; }
  .full { grid-column: 1 / -1; }
  .chart { height: 440px; }
  .pchart { height: 220px; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--s4); }
  .pgrid:empty { display: none; }

  /* lists & tables */
  .empty { color: var(--muted-foreground); font-size: 13px; padding: var(--s2) 0; }
  .plist { display: grid; gap: var(--s2); }
  .prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--s3); padding: var(--s2) 0;
          border-bottom: 1px solid var(--border); }
  .prow:last-child { border-bottom: 0; }
  .prow .sym { font-weight: 600; }
  .prow .pnl { font-weight: 600; text-align: right; }
  .prow .d { font-size: 12px; color: var(--muted-foreground); grid-column: 1 / -1; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { height: 36px; padding: 0 var(--s3); text-align: left; color: var(--muted-foreground); font-weight: 500;
       border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: var(--s2) var(--s3); border-bottom: 1px solid var(--border); white-space: nowrap; }
  th.n, td.n { text-align: right; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--muted); }
  td.sym { font-weight: 500; }

  /* activity */
  .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); cursor: pointer; }
  ul.events { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow-y: auto; }
  ul.events li { display: grid; grid-template-columns: 44px auto minmax(0, 1fr); gap: var(--s2); align-items: center;
                 padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  ul.events li:last-child { border-bottom: 0; }
  ul.events .t { color: var(--muted-foreground); }
  ul.events .i { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }

  @media (max-width: 1100px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 720px) {
    main { padding: var(--s4) var(--s4) var(--s5); }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chart { height: 320px; }
    .controls { width: 100%; } select { flex: 1; } #updated { width: 100%; }
    .pgrid { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Paper trading</h1>
      <p class="sub" id="subtitle">Loading…</p>
    </div>
    <div class="controls">
      <label for="acctSel" class="muted">Strategy</label>
      <select id="acctSel" aria-label="Paper account"></select>
      <span id="status" class="badge dot">loading</span>
      <span id="updated" class="muted"></span>
    </div>
  </header>

  <section class="accounts" id="accounts" aria-label="All paper accounts"></section>

  <section class="kpis" aria-label="Selected account">
    <div class="card kpi"><div class="k">Equity</div><div class="v" id="equity">–</div><div class="s" id="equitySub"></div></div>
    <div class="card kpi"><div class="k">Today's P&amp;L</div><div class="v" id="daypnl">–</div><div class="s" id="daySub"></div></div>
    <div class="card kpi"><div class="k">Trades today</div><div class="v" id="trades_n">–</div><div class="s" id="tradesSub"></div></div>
    <div class="card kpi"><div class="k">Open positions</div><div class="v" id="open_n">–</div><div class="s" id="openSub"></div></div>
  </section>

  <div class="layout">
    <div class="col">
      <div class="card">
        <div class="card-h"><h2 id="spotTitle">Spot</h2><span class="muted">1-min · ▲▼ entries · ● exits</span></div>
        <div class="card-b"><div id="spot" class="chart"></div></div>
      </div>
      <div id="posCharts" class="pgrid"></div>
    </div>
    <div class="col">
      <div class="card">
        <div class="card-h"><h2>Open positions</h2><span class="muted" id="posSub"></span></div>
        <div class="card-b"><div id="positions" class="plist"></div></div>
      </div>
      <div class="card">
        <div class="card-h"><h2>Activity</h2>
          <label class="toggle"><input type="checkbox" id="showFills"> show fills</label></div>
        <div class="card-b"><ul class="events" id="events"></ul></div>
      </div>
    </div>
    <div class="card full">
      <div class="card-h"><h2>Today's trades</h2><span class="muted" id="whatif"></span></div>
      <div class="card-b scroll" id="trades"></div>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const inr = v => v == null ? "–" : "₹" + Math.round(v).toLocaleString("en-IN");
const sinr = v => v == null ? "–" : (v >= 0 ? "+" : "−") + "₹" + Math.abs(Math.round(v)).toLocaleString("en-IN");
const kinr = v => (v >= 0 ? "+" : "−") + "₹" + (Math.abs(v) >= 1000 ? (Math.abs(v) / 1000).toFixed(1) + "k" : Math.round(Math.abs(v)));
const num = v => v == null || v === "" ? "–" : Number(v).toFixed(2);
const cls = v => v > 0 ? "pos" : v < 0 ? "neg" : "";
const hhmm = s => s ? String(s).replace("T", " ").slice(11, 16) : "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const bullish = (type, side) => (type === "CE") === (side === "BUY");   // long calls / short puts
const strikeLabel = (strike, type) => `${Math.round(strike)}${type}`;

let current = store.get("account");
let accounts = [];
$("showFills").checked = store.get("showFills") === "1";
$("showFills").onchange = () => { store.set("showFills", $("showFills").checked ? "1" : "0"); poll(); };
$("acctSel").onchange = e => select(e.target.value);

function makeChart(el) {
  const c = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: { background: { color: "transparent" }, textColor: css("--muted-foreground"),
              fontFamily: "Inter, system-ui, sans-serif", fontSize: 11, attributionLogo: false },
    grid: { vertLines: { visible: false }, horzLines: { color: css("--border") } },
    rightPriceScale: { borderVisible: false, scaleMargins: { top: 0.1, bottom: 0.08 } },
    timeScale: { borderVisible: false, timeVisible: true, secondsVisible: false },
    crosshair: { mode: 0, vertLine: { color: css("--ring") }, horzLine: { color: css("--ring") } },
  });
  const s = c.addCandlestickSeries({ upColor: css("--up"), downColor: css("--down"),
                                     wickUpColor: css("--up"), wickDownColor: css("--down"), borderVisible: false });
  return { chart: c, series: s, lines: [] };
}
const spot = makeChart($("spot"));
let fitted = false;
const posCharts = new Map();

function select(id) {
  if (id === current) return;
  current = id; store.set("account", id); fitted = false;
  for (const pc of posCharts.values()) { pc.chart.remove(); pc.el.remove(); }
  posCharts.clear();
  poll();
}

function statusOf(d) {
  const ageMin = (Date.now() + 19800000 - Date.parse(d.ts + "Z")) / 60000;   // ts is IST wall-clock
  if (d.halted_on) return ["halt", "Kill switch"];
  if (d.day_closed) return ["closed", "Day closed"];
  if (ageMin > 2) return ["stale", `Stale · ${Math.round(ageMin)} min`];
  return ["live", "Live"];
}

function renderAccounts() {
  const sel = $("acctSel");
  const opts = accounts.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("");
  if (sel.innerHTML !== opts) sel.innerHTML = opts;
  sel.value = current;
  $("accounts").innerHTML = accounts.length < 2 ? "" : accounts.map(a => {
    const day = (a.realised_today ?? 0) + (a.unrealised ?? 0);
    const [k, label] = a.ts ? statusOf(a) : ["closed", "–"];
    return `<button class="acct ${a.id === current ? "sel" : ""}" data-id="${esc(a.id)}">
      <span class="top"><span class="name">${esc(a.name)}</span><span class="badge dot ${k}">${label}</span></span>
      <span class="eq">${inr((a.equity ?? 0) + (a.unrealised ?? 0))}</span>
      <span class="meta"><span class="${cls(day)}">${sinr(day)}</span> today · ${a.trades ?? 0} trades · ${a.open ?? 0} open</span>
    </button>`;
  }).join("");
  for (const b of $("accounts").querySelectorAll(".acct")) b.onclick = () => select(b.dataset.id);
}

function table(el, cols, rows) {
  if (!rows.length) { el.innerHTML = '<p class="empty">No trades yet today.</p>'; return; }
  el.innerHTML = "<table><thead><tr>" + cols.map(c => `<th class="${c.n ? "n" : ""}">${c.h}</th>`).join("") +
    "</tr></thead><tbody>" + rows.map(r => "<tr>" + cols.map((c, i) =>
      `<td class="${c.n ? "n " : ""}${i === 0 ? "sym " : ""}${c.cls ? c.cls(r) : ""}">${c.v(r)}</td>`).join("") + "</tr>").join("") +
    "</tbody></table>";
}

function render(d) {
  $("subtitle").textContent = `${d.underlying} · ${d.strategy} · fills at ${d.fill_model} · simulated, no real orders`;
  $("spotTitle").textContent = `${d.underlying} spot`;
  const [k, label] = statusOf(d);
  $("status").className = "badge dot " + k; $("status").textContent = label;
  $("updated").textContent = `Updated ${hhmm(d.ts)} IST`;

  const eq = d.equity + d.unrealised, ret = (eq / d.initial_capital - 1) * 100;
  $("equity").textContent = inr(eq);
  $("equitySub").innerHTML = `<span class="${cls(ret)}">${ret >= 0 ? "+" : ""}${ret.toFixed(1)}%</span> on ${inr(d.initial_capital)}` +
    (d.withdrawn ? ` · withdrawn ${inr(d.withdrawn)}` : "");
  const day = d.realised_today + d.unrealised;
  $("daypnl").textContent = sinr(day); $("daypnl").className = "v " + cls(day);
  $("daySub").textContent = `realised ${sinr(d.realised_today)} · open ${sinr(d.unrealised)}`;
  const wins = d.trades.filter(t => t.net_pnl > 0).length;
  $("trades_n").textContent = d.trades.length;
  $("tradesSub").textContent = d.trades.length ? `${wins} won · ${d.trades.length - wins} lost` : "none yet";
  $("open_n").textContent = d.positions.length;
  $("openSub").textContent = d.positions.length ? d.positions.map(p => strikeLabel(p.contract.strike, p.contract.option_type)).join(", ") : "flat";

  spot.series.setData(d.spot);
  const marks = [];
  for (const t of d.trades) {
    const up = bullish(t.type, t.side);
    marks.push({ time: t.entry_ts, position: up ? "belowBar" : "aboveBar", color: css("--accent"),
                 shape: up ? "arrowUp" : "arrowDown", text: strikeLabel(t.strike, t.type) });
    marks.push({ time: t.exit_ts, position: up ? "aboveBar" : "belowBar", color: t.net_pnl >= 0 ? css("--up") : css("--down"),
                 shape: "circle", text: kinr(t.net_pnl) });
  }
  for (const p of d.positions) {
    const up = bullish(p.contract.option_type, p.side);
    marks.push({ time: p.entry_ts, position: up ? "belowBar" : "aboveBar", color: css("--warn"),
                 shape: up ? "arrowUp" : "arrowDown", text: "open " + strikeLabel(p.contract.strike, p.contract.option_type) });
  }
  spot.series.setMarkers(marks.sort((a, b) => a.time - b.time));
  if (!fitted && d.spot.length) { spot.chart.timeScale().fitContent(); fitted = true; }

  // one premium chart per open position, with entry / SL / target lines
  const open = new Set(d.positions.map(p => p.symbol));
  for (const [sym, pc] of posCharts) if (!open.has(sym)) { pc.chart.remove(); pc.el.remove(); posCharts.delete(sym); }
  for (const p of d.positions) {
    let pc = posCharts.get(p.symbol);
    if (!pc) {
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `<div class="card-h"><h2></h2><span class="badge"></span></div><div class="card-b"><div class="pchart"></div></div>`;
      $("posCharts").appendChild(el);
      pc = { ...makeChart(el.querySelector(".pchart")), el };
      posCharts.set(p.symbol, pc);
    }
    pc.el.querySelector("h2").textContent = `${p.symbol} premium`;
    const b = pc.el.querySelector(".badge");
    b.textContent = sinr(p.pnl); b.className = "badge " + (p.pnl > 0 ? "good" : p.pnl < 0 ? "bad" : "");
    pc.series.setData(p.bars);
    pc.lines.forEach(l => pc.series.removePriceLine(l));
    pc.lines = [["Entry", p.entry_price, css("--accent")], ["SL", p.sl_price, css("--down")], ["Target", p.target_price, css("--up")]]
      .filter(x => x[1] != null)
      .map(([title, price, color]) => pc.series.createPriceLine({ price, color, title, lineWidth: 1, lineStyle: 2 }));
  }

  $("posSub").textContent = d.positions.length ? `unrealised ${sinr(d.unrealised)}` : "";
  $("positions").innerHTML = d.positions.length ? d.positions.map(p => `<div class="prow">
      <span class="sym">${esc(p.symbol)}</span><span class="pnl ${cls(p.pnl)}">${sinr(p.pnl)}</span>
      <span class="d">${p.side} ×${p.qty} @ ${num(p.entry_price)} (${hhmm(p.entry_time)}) · LTP ${num(p.ltp)} · SL ${num(p.sl_price)}${p.target_price ? " · TGT " + num(p.target_price) : ""}</span>
    </div>`).join("") : '<p class="empty">Flat: no open positions.</p>';

  table($("trades"), [
    { h: "Option", v: t => esc(t.symbol) },
    { h: "Side", v: t => t.side },
    { h: "Qty", v: t => t.qty, n: 1 },
    { h: "Entry", v: t => `${hhmm(t.entry_time)} · ${num(t.entry_price)}`, n: 1 },
    { h: "Exit", v: t => `${hhmm(t.exit_time)} · ${num(t.exit_price)}`, n: 1 },
    { h: "Reason", v: t => `<span class="badge">${esc(t.exit_reason)}</span>` },
    { h: "Net", v: t => sinr(t.net_pnl), cls: t => cls(t.net_pnl), n: 1 },
  ], [...d.trades].reverse());

  const showFills = $("showFills").checked;
  $("events").innerHTML = [...d.events].reverse().filter(e => showFills || e.event !== "fill").map(e => {
    const { event, ts, t, ...rest } = e;
    const info = event === "entry_blocked" ? rest.rule
      : event === "entry" ? `${rest.side} ${rest.lots} lot · ${strikeLabel(rest.contract.strike, rest.contract.option_type)} @ ${num(rest.entry_price)}`
      : event === "trade_closed" ? `${rest.symbol} ${sinr(rest.net_pnl)} (${rest.exit_reason})`
      : event === "day_closed" ? `${rest.trades} trades, net ${sinr(rest.net)}`
      : rest.symbol ?? rest.error ?? "";
    const tone = event === "error" || event === "entry_blocked" ? "bad"
      : event === "trade_closed" ? (rest.net_pnl >= 0 ? "good" : "bad") : event === "entry" ? "info" : "";
    return `<li><span class="t">${hhmm(ts ?? t)}</span><span class="badge ${tone}">${esc(event.replace("_", " "))}</span>` +
           `<span class="i">${esc(info)}</span></li>`;
  }).join("") || '<li class="empty">No activity yet.</li>';
}

let whatifFor = null;
async function whatifLink(d) {
  const day = String(d.ts).slice(0, 10), key = current + day;
  if (whatifFor === key) return;
  whatifFor = key;
  const url = `${current}/whatif-${day}.html`;
  const ok = await fetch(url, { cache: "no-store" }).then(r => r.ok).catch(() => false);
  $("whatif").innerHTML = ok ? `<a href="${esc(url)}">What-if replay of today →</a>` : "";
}

async function poll() {
  try {
    accounts = await (await fetch("accounts.json", { cache: "no-store" })).json();
    if (!accounts.length) {
      const sel = $("acctSel");
      sel.innerHTML = '<option>No accounts yet</option>'; sel.disabled = true;
      $("accounts").innerHTML = "";
      $("subtitle").textContent = "No paper accounts yet. They appear when the bot processes its first minute (weekdays from 09:15 IST).";
      throw new Error("Waiting for the first session");
    }
    $("acctSel").disabled = false;
    if (!accounts.some(a => a.id === current)) current = accounts[0].id;
    renderAccounts();
    const r = await fetch(`live.json?account=${encodeURIComponent(current)}`, { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    render(d);
    whatifLink(d);
  } catch (e) {
    $("status").className = "badge dot stale"; $("status").textContent = "No data";
    $("updated").textContent = e.message;
  }
}
poll();
setInterval(poll, 5000);
</script>
</body>
</html>
